<!DOCTYPE html>
<html>
<head>
  <style>
    .image-container { position: relative; max-width: 100%; }
    .image-container img { display: block; width: 100%; }
    .marker {
      position: absolute;
      width: 14px;
      height: 14px;
      background-color: #6d4aff;
      border: 2px solid white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
    }
    .tooltip-text {
      visibility: hidden;
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background-color: #1a1a2e;
      color: white;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      white-space: nowrap;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .marker:hover .tooltip-text { visibility: visible; opacity: 1; }
  </style>
</head>
<body>
  <div class="image-container">
    <img src="1.png" alt="1">
    
    <div class="marker" style="top: 20%; left: 35%;">
      <span class="tooltip-text">Section A: Overview</span>
    </div>
    
    <div class="marker" style="top: 55%; left: 70%;">
      <span class="tooltip-text">Section B: Details</span>
    </div>
  </div>
</body>
</html>
