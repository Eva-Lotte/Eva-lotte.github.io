      <p class="tooltip">
Gerard Genette teilt die Funktion des Erz&auml;hlers ein in  Stimme und Modus. Stimme = wer spricht? Ist der Erz&auml;hler Teil der Figuren (homodiegetisch) oder nicht (heterodoegetisch)? Auch, ob eine Binnenerz&auml;hlung vorliegt, kann mit Genette auf drei Grade genau bestimmt werden (intradiegetisch, extradiegetsch, metadiegetisch). Bei Stanzel hei&szlig;t dasselbe auktorialer, personaler oder Ich-Erz&auml;hler. In der mittelalterlichen Literatur ist die häufigste Form des Erzählers mit Genette ein hetero- und extradiegetischer Erzähler. Mit Stanzel handelt es sich meistens um einen auktorialen Erzähler, der ab und zu personal ist.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
      <circle cx="81.5%" cy="47.8%" r="6" fill="#7777e9" />
      <foreignObject x="58%" y="48%" width="250" height="500">
      <p class="tooltip">
In Genette's Terminologie umfasst Modus Distanz, sowie Fokalisierung. Nullperspektive = Perspektive aller Figuren. Interne Fokalisierung = Perspektive einer Figur. Externe Fokalisierung = Perspektive keiner einzigen Figur.
Mit Genette ist die häufigste Fokalisierung externe Fokalisierung mit teilweiser Nullfokalisierung.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
      <circle cx="19%" cy="72.5%" r="6" fill="#7777e9" />
      <foreignObject x="21%" y="70.5%" width="500" height="500">
      <p class="tooltip">
Der Raum entsteht durch die Figuren, die sich in ihm bewegen und ist damit funktional von den Erfordernissen der Handlung abh&auml;ngig, mitunter ohne Koh&auml;renz (z.B. T&uuml;ren, die erscheinen, wenn sie gebraucht werden). Fiktionale und reale Geographie k&ouml;nnen nebeneinander bestehen, auch ist Raum oft semantisch aufgeladen, z.B. f&uuml;hrt das linke Abbiegen nicht selten ins Verderben.
Vier Grundtypen von R&auml;umen werden in der mittelalterlichen Literatur unterschieden: Inselraum, Fixpunktraum, elastischer und nicht-elastischer Wegeraum.
      </p>
      </foreignObject>
    </g>
