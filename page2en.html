Gerard Genette divides the function of the narrator into the categories voice and mode. Voice = who is speaking? Is the narrator part of the cast of characters (homodiegetic) or not (heterodiegetic)? Furthermore with Genette embedded narratives can be described down to three levels of nesting (intradiegetic, extradiegetic, metadiegetic). In Stanzel's terminology, voice corresponds to auctorial, personal, or first-person narrator.
In medieval literature the most common type of narrator, with Genette, is a hetero- and extradiegetic narrator. With Stanzel, it is a usually  authorial narrator who is occasionally personal.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
      <circle cx="81.5%" cy="47.8%" r="6" fill="#7777e9" />
      <foreignObject x="58%" y="48%" width="250" height="500">
      <p class="tooltip">
In Genette's terminology, mode encompasses both distance and focalisation. Zero perspective = the perspective of all characters. Internal focalisation = the perspective of a single character. External focalisation = the perspective of no single character. 
With Genette, the most common type of focalisation in medieval literature is external focalisation with partial zero focalisation.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
      <circle cx="19%" cy="72.5%" r="6" fill="#7777e9" />
      <foreignObject x="21%" y="70.5%" width="500" height="500">
      <p class="tooltip">
Space is created by the characters moving through it and is therefore functionally dependent on the requirements of the plot, sometimes without any coherence (e.g. doors that appear when they are needed). Fictional and real geography can coexist, moreover space is often semantically charged – for example, turning left at a crossroads frequently leads to ruin.
Medieval literature distinguishes between four basic types of space: Insular spaces, fixed-point spaces, and elastic and non-elastic path spaces.
      </p>
      </foreignObject>
    </g>
