      <p class="tooltip">
Klassische Narratologie unterscheidet zwischen Erz&auml;hlzeit und erz&auml;hlter Zeit, Prolepsen und Analepsen = zwischen Anordnung, Tempo und Frequenz.
 Das Mittelalter bevorzugt einstr&auml;ngiges und chronologisches Erz&auml;hlen. Raffungen, Streckungen und Einsch&uuml;be gibt es nat&uuml;rlich trotzdem.
Besondere Zeitph&auml;nomene mittelalterlichen Erz&auml;hlens umfassen:
<br>
&#x2022; Episodische Zeit (relativ zeitloses Erz&auml;hlen) <br>
&#x2022; Mythische Vorzeit <br>
&#x2022; Heterochronien (unterschiedliche Zeit in unterschiedlichen R&auml;umen)<br>
&#x2022; Paradoxa <br>
&#x2022; Achronien
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
      <circle cx="42.5%" cy="61%" r="6" fill="#7777e9" />
      <foreignObject x="44%" y="59.5%" width="400" height="500">
      <p class="tooltip">
Raum und Zeit entstehen erst durch die Figuren, die sich in ihnen bewegen. Unterschiedliche Zeiten werden oft durch unterschiedliche R&auml;ume dargestellt = Chronotopoi. Dort sind Raum und Zeit aneinander gekoppelt und die Zeit vergeht so, wie die Geschichte es ben&ouml;tigt. Jede Geschichte, jede Art von Erz&auml;hlen, hat einen eigenen Chronotopos - und in vielen Geschichten gibt es mehrere Chronotopoi. F&uuml;r das Mittelalter typisch sind beispielsweise <it>locus amoenus</it> und <it>locus terribilis</it>, Feen- und andere Inseln oder Orte wie beispielsweise die Minnegrotte in Gottfried von Stra&szlig;burgs "Tristan".
      </p>
      </foreignObject>
    </g>
