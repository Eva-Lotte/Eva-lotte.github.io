      <p class="tooltip">
Classical narratology distinguishes between narrative time and narrated time and prolepses and analepses = between arrangement, pace and frequency.
The Middle Ages favoured single-strand, chronological narrating. Of course, compressions, expansions, and insertions still occur.
Particular temporal phenomena in medieval narrative include:
&#x2022; Episodic time (relatively timeless storytelling) <br>
&#x2022; Mythical prehistory <br>
&#x2022; Heterochronies (different times in different spaces) <br>
&#x2022; Paradoxes <br>
&#x2022; Achronies
      </p>
      </foreignObject>
    </g>

<g class="hotspot">
      <circle cx="58%" cy="60%" r="6" fill="#7777e9" />
      <foreignObject x="42.5%" y="61%" width="250" height="500">
      <p class="tooltip">
Space and time only come into existence through the characters who move within them. Different times are often represented by different spaces = chronotopes. There, space and time are intertwined, and time passes as the story requires. Every story, every form of narrative, has its own chronotope – and in many stories there are several chronotopes.
      </p>
      </foreignObject>
    </g>
