Typischer, d.h. mehreren narrativen Texten (z.B. Gattung) gemeinsamer Handlungsverlauf. Ein Handlungsschema ist komplexer als ein Motiv oder eine Erz&auml;hlkette. Schemaorientiertes Erz&auml;hlen ist typisch f&uuml;r m&uuml;ndliches Erz&auml;hlen, aber auch moderne Trivial- und Unterhaltungsliteratur. Z.B.: Brautwerbungsschema, gef&auml;hrliche Brautwerbung, gest&ouml;rte Martenehe, Schwankschema). Ein Erz&auml;hlschema braucht keine Motivation.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
<circle cx="24%" cy="84.5%" r="6" fill="#7777e9" />
      <foreignObject x="26%" y="82%" width="500" height="500">
      <p class="tooltip">
Kausale Motivation (Ursache-Wirkung), finale Motivation (alles ist von Beginn an festgelegt), kompositorische Motivation: metaphorisch (Ereignisse, die als Metapher f&uuml;r die gesamte Erz&auml;hlung stehen), metonymische (Dinge werden nur erw&auml;hnt, weil sie sp&auml;ter einmal
Wichtig werden). F&uuml;r das Mittelalter typisch sind: Blinde Motive, hierarchische Koh&auml;renz (f&uuml;r einen Textteil, nicht den ganzen Text).      
      </p>
      </foreignObject>
    </g>
