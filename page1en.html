Discours bedeutet die Form einer Geschichte, d.h. die Art, wie die Ereignisse der Histoire-Ebene zusammengef&uuml;gt werden. Hierf&uuml;r ist axiologische = moralische Bewertung notwendig, welche durch die Form ausgedr&uuml;ckt wird, Spannung herstellt, etc.

Histoire bedeutet weitestgehend den Inhalt einer Geschichte, d.h. alle vorkommenden Ereignisse in chronologischer Form. Die Histoire-Ebene einer Erz&auml;hlung umfasst: Raum, Handlungsschema und Motivierung.
      </p>
      </foreignObject>
    </g>

Histoire und Discours liegt den meisten narratologischen Modellen zugrunde. Diese Unterscheidung geht auf Aristoteles zur&uuml;ck, Boris Tomaschewski bestimmt 1925 <i>sujet</i> und <i>fabula</i>, Tzvetan Todorov schlie&szlig;lich etabliert die Terminologie von Histoire und Discours. Auf Karlheinz Stierle gehen die deutschen Bezeichnungen "Geschichte" und "Geschehen" zur&uuml;ck.
