      <p class="tooltip">
Discours refers to the form of a narrative, that is the way in which the events of the Histoire level are woven together. This requires an axiological = moral evaluation, which is expressed through form, creates suspense, etc. The Discours level of a story comprises: time, voice, and mode.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
      <circle cx="30.5%" cy="95.6%" r="8" fill="#5555e4" />
      <foreignObject x="32%" y="84%" width="300" height="500">
      <p class="tooltip">
Histoire largely refers to the content of a narrative, i.e. all the events that occur in chronological order. The Histoire level of a story comprises: space, plot schema, and motivation.
      </p>
      </foreignObject>
    </g>

    <g class="hotspot">
     <circle cx="5%" cy="10%" r="8" fill="#5555e4" />
     <foreignObject x="5%" y="10%" width="300" height="500"> 
    <p class="tooltip">
Histoire and Discours form the basis of most narratological models. Their distinction dates back to Aristotle; in 1925, Boris Tomashevsky defined <i>sujet</i> and <i>fabula</i>, and Tzvetan Todorov ultimately established the terminology of Histoire and Discours.
      </p>
      </foreignObject>
    </g>

  </svg>
