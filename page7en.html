Es gibt kaum Konsens &uuml;ber den narratologischen Status literarischer Figuren. Strukturalistische Theorie: Figuren sind Handlungstr&auml;ger, prinzipiell austauschbar, nur narrative Einheiten und Motive sind die Grundbedingung einer Erz&auml;hlung.
Aktantenmodell nach Greimas: Das Subjekt begehrt ein Objekt, der Helfer unterst&uuml;tzt das Subjekt bei der Beschaffung des Objekts, der Opponent arbeitet gegen den Helfer, der Sender initiiert eine Aktion, der Empf&auml;nger profitiert von der Aktion oder dem Objekt. Ob das Subjekt das Objekt erh&auml;lt oder nicht, h&auml;ngt von Machtverh&auml;ltnissen ab.
Neuere Ans&auml;tze: Figur steht au&szlig;erhalb von Histoire und Discours, bzw. geh&ouml;ren zu beidem. Chatman: Erz&auml;hlungen bestehen aus Events (Acrions, Happenings) und Existents (Characters, Setting).
Im Mittelalter sind besonders Figurentypen wichtig, Identit&auml;t entsteht &uuml;ber Gruppenzugeh&ouml;rigkeit.
